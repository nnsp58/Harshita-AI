    <style>
        body {
            font-family: 'Segoe UI', 'Noto Sans Devanagari', sans-serif;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 400px;
            margin: 40px auto;
            padding: 12px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .clock {
            width: 200px;
            height: 200px;
            border: 2px solid #1a1a2e;
            border-radius: 50%;
            position: relative;
        }
        .hour-hand {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(97.5deg);
            width: 4px;
            height: 80px;
            background-color: #1a1a2e;
            border-radius: 2px;
            z-index: 1;
        }
        .minute-hand {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(234deg);
            width: 2px;
            height: 120px;
            background-color: #4834d4;
            border-radius: 1px;
            z-index: 2;
        }
        .center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background-color: #1a1a2e;
            border-radius: 50%;
            z-index: 3;
        }
        .angle {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }
        @media (max-width: 412px) {
            .container {
                padding: 12px;
            }
            .clock {
                width: 150px;
                height: 150px;
            }
            .hour-hand {
                height: 60px;
            }
            .minute-hand {
                height: 90px;
            }
        }
    </style>
</head>

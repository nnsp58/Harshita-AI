services:
  - type: web
    name: harshita-ai
    env: node
    branch: feature/subscription-engine
    buildCommand: npm install && cd frontend && npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GOOGLE_CLIENT_ID
        value: 324192050296-o3da0b1e1gqv03anut0cq12ajvlu7hnq.apps.googleusercontent.com
      - key: VITE_GOOGLE_CLIENT_ID
        value: 324192050296-o3da0b1e1gqv03anut0cq12ajvlu7hnq.apps.googleusercontent.com
